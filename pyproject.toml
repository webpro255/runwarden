[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runwarden"
version = "0.1.0.dev0"
description = "Cross-run isolation probing for autonomous agent environments"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "David", email = "21160034+webpro255@users.noreply.github.com" }]
dependencies = []

[project.scripts]
runwarden = "runwarden.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/runwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
